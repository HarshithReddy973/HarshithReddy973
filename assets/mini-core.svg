<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120">
<defs>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .core { animation:pulse 2.4s ease-in-out infinite; transform-origin:90px 60px; }
    .orbit { animation:spin 7s linear infinite; transform-origin:90px 60px; }
    .dot { animation:blink 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(.9);opacity:.55} 50%{transform:scale(1.08);opacity:1} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
    @media (prefers-reduced-motion:reduce) {
      .core,.orbit,.dot { animation:none; }
    }
  </style>
</defs>
<circle cx="90" cy="60" r="34" fill="none" stroke="#58a6ff" stroke-opacity=".13"/>
<circle cx="90" cy="60" r="23" fill="none" stroke="#58a6ff" stroke-opacity=".22" stroke-dasharray="2 7" class="orbit"/>
<circle cx="90" cy="60" r="8" fill="#58a6ff" filter="url(#glow)" class="core"/>
<circle cx="90" cy="25" r="3" fill="#58a6ff" class="dot"/>
</svg>
